[package]
name = "twec"
version = "0.1.0-pre"
edition = "2021"
description = "Twe language compiler and tree-walking interpreter"
publish = false

[lints.rust]
# v0.2 Phase 8.5 (session 8a): eased from `forbid` to `deny` so
# `src/tagged_value.rs` can scope `#![allow(unsafe_code)]`. NaN
# tagging requires bit-level pointer manipulation
# (`Rc::into_raw` / `Rc::from_raw`) that Rust's safety model
# can't express in safe code. The exception is intentionally
# narrow: only `tagged_value.rs` may use unsafe; every other
# module stays under the project-wide deny.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
macroquad = { version = "0.4", default-features = false, features = ["audio"] }
# Phase 5 task 5 session 1: wgpu-driven 3D rendering for `twec play3d`.
# winit handles the window + event loop; pollster blocks on the few
# async wgpu calls (adapter + device acquisition). bytemuck only
# enters when vertex / uniform layout work lands in a later session.
wgpu = "22.0"
winit = "0.30"
pollster = "0.3"
# Phase 5 task 5 session (b): vertex / uniform buffer layout via
# `#[derive(Pod, Zeroable)]`. Required as soon as the GPU sees
# anything other than a clear color.
bytemuck = { version = "1", features = ["derive"] }
# v0.2 session 1: glTF 2.0 mesh import. Pure-Rust, no native deps.
# Default features pull the `image` crate (texture decoding) which
# we don't need yet — disabled. `import` gives us `gltf::import` for
# .glb loading; `utils` exposes the `Reader` API used to extract
# POSITION / NORMAL / index accessors.
gltf = { version = "1", default-features = false, features = ["import", "utils"] }
# Phase 9 session 5: cross-platform gamepad input. Macroquad 0.4 has
# no gamepad support of its own (input.rs ships a "and gamepads soon"
# header and zero functions); gilrs is the canonical Rust gamepad
# crate, uses XInput on Windows, evdev on Linux, IOKit on macOS. No
# native build deps on any of the target platforms.
gilrs = "0.10"

[dev-dependencies]
insta = "1.41"
