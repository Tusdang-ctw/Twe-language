name: wasm-demo

# web3d-M6: build examples/flappy.twe as a browser-playable web demo on
# the one browser runtime (crates/twe-web, WebGPU) and publish it to
# GitHub Pages on every push to main and every GitHub Release. Before
# web3d-M6 this built a separate macroquad wasm game per project; now the
# runtime is prebuilt once and `twec build --target web` ships it with
# the game's scripts and assets (2D games run on it too since web3d-M6).
#
# One-time manual setup (repository owner):
#   Settings -> Pages -> Source: "Deploy from a branch"
#   Branch: gh-pages   Folder: / (root)
#
# After that, every push to main updates the demo at:
#   https://<owner>.github.io/<repo>/
#
# How it works:
#   1. Build twec for the Linux host (cargo build --release).
#   2. Build the browser runtime: twe-web for wasm32, then wasm-bindgen
#      into target/web-runtime/ (twec build looks there by default).
#   3. Wrap examples/flappy.twe in a minimal project directory.
#   4. Run `twec build --target web _flappy_demo/`, which copies the
#      prebuilt runtime + index.html + env.js + the game bundle.
#   5. Push dist/web/ to the gh-pages branch.

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-deploy:
    name: Build web demo + deploy to Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push to gh-pages branch

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.100 --locked || cargo install wasm-bindgen-cli --locked

      # Cache both the host build and the wasm32 build artifacts.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-wasm-

      - name: Build twec (Linux host)
        run: cargo build --release

      - name: Build the browser runtime (twe-web)
        run: |
          cargo build -p twe-web --target wasm32-unknown-unknown --release
          wasm-bindgen --target web --no-typescript \
            --out-dir target/web-runtime \
            target/wasm32-unknown-unknown/release/twe_web.wasm

      - name: Prepare flappy demo project layout
        run: |
          mkdir -p _flappy_demo
          cp examples/flappy.twe _flappy_demo/main.twe

      - name: Build web demo
        run: ./target/release/twec build --target web _flappy_demo/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _flappy_demo/dist/web
          commit_message: "wasm-demo: ${{ github.ref_name }} (${{ github.sha }})"
