name: ci

# Phase 7 #1 companion: regular CI gate. Runs on every PR + push
# to main. Builds, tests, lints, and checks fmt; mirrors the
# locally-required pre-merge bar in CLAUDE.md ("zero warnings,
# clippy clean, tests pass, docs in same commit").

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (release)
        run: cargo build --release

      - name: Test
        run: cargo test --release

      # web3d-M0: seeded differential GC fuzzer at the milestone's
      # exit-criterion scale (the default `cargo test` run does 200).
      - name: GC fuzz (1000 seeds)
        env:
          TWE_GC_FUZZ_SEEDS: "1000"
        run: cargo test --release --test gc_fuzz

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      # web3d-M0: scaffolding namespaces build only with this feature;
      # keep them compiling + tested so gating them doesn't rot them.
      - name: Clippy (experimental)
        run: cargo clippy --release --all-targets --features experimental -- -D warnings

      - name: Test (experimental)
        run: cargo test --release --features experimental

      # Format check is Linux-only — line-ending differences across
      # platforms make rustfmt --check noisy on Windows checkouts.
      - name: Format check
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

  # web3d-M0: the browser (wasm32) build silently stopped compiling
  # during the 3D phases — 32 errors that nothing caught. It is the
  # v1.0 target platform now, so every PR must keep it building clean.
  wasm-check:
    name: WASM check (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-wasm32-${{ hashFiles('**/Cargo.lock') }}

      - name: Clippy (wasm32)
        run: cargo clippy --release --target wasm32-unknown-unknown -- -D warnings

      - name: Clippy (wasm32, experimental)
        run: cargo clippy --release --target wasm32-unknown-unknown --features experimental -- -D warnings

      # web3d-M2: build the browser runtime `twec build --target web`
      # ships (crates/twe-web → twe_web.js + twe_web_bg.wasm).
      - name: Clippy (twe-web)
        run: cargo clippy --release -p twe-web --target wasm32-unknown-unknown -- -D warnings

      - name: Build web runtime
        run: cargo build --release -p twe-web --target wasm32-unknown-unknown

      # Must match the `wasm-bindgen` version pinned in
      # crates/twe-web/Cargo.toml: the CLI and the library share a
      # schema and refuse to mix versions.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.120

      - name: wasm-bindgen
        run: >
          wasm-bindgen --target web --no-typescript --out-dir target/web-runtime
          target/wasm32-unknown-unknown/release/twe_web.wasm

      # Every `env` import left by macroquad must be stubbed in web/env.js.
      - name: Web runtime imports are all provided
        run: cargo test --release --test web_runtime
        env:
          TWE_WEB_WASM: target/wasm32-unknown-unknown/release/twe_web.wasm

      - uses: actions/upload-artifact@v4
        with:
          name: web-runtime
          path: target/web-runtime/

      # web3d-M3: the wasm script tick on the 5,000-enemy benchmark
      # (exit target: median <= 4 ms). Reported, not gated: CI runners'
      # speed varies too much for a hard threshold.
      - name: wasm tick benchmark (swarm_3d)
        run: |
          wasm-bindgen --target nodejs --no-typescript --out-dir target/web-bench \
            target/wasm32-unknown-unknown/release/twe_web.wasm
          node web/bench.mjs examples/swarm_3d.twe 300

  # Phase 34 session 5: cross-compile validation. The release.yml
  # matrix builds the artifacts on tag push, but a tag is too late to
  # discover that someone just merged a PR that breaks aarch64-linux.
  # This job runs on every PR and proves all four release targets at
  # least cargo-check (no full link, to keep CI runtime bounded).
  cross-check:
    name: Cross-compile check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-gnu

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compile linker
        run: |
          sudo apt-get update
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          fi
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-gnu" ]; then
            sudo apt-get install -y mingw-w64
          fi

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-cross-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Cargo check
        run: cargo check --release --target ${{ matrix.target }} --bin twec
