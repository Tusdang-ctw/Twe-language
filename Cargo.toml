[package]
name = "twec"
version = "0.1.0"
edition = "2021"
description = "Twe language compiler and tree-walking interpreter"
publish = false

[lints.rust]
# v0.2 Phase 8.5 (session 8a): eased from `forbid` to `deny` so
# `src/tagged_value.rs` can scope `#![allow(unsafe_code)]`. NaN
# tagging requires bit-level pointer manipulation
# (`Rc::into_raw` / `Rc::from_raw`) that Rust's safety model
# can't express in safe code. Phase 11 follow-on extends the
# exception to `src/window_focus.rs` for `GetForegroundWindow`
# / `GetWindowThreadProcessId` (auto-pause-on-window-blur).
# The exception is intentionally narrow: only those two files
# may use unsafe; every other module stays under the
# project-wide deny.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
# macroquad is the 2D backend and supports wasm32 natively —
# stays in the unconditional section.
macroquad = { version = "0.4", default-features = false, features = ["audio"] }

# Phase 12 session 5: `twe.toml` project manifest parsing. Pure Rust,
# compiles on all targets including wasm32.
toml = "0.8"

# Phase 15 session 3: optional Steam SDK integration. Requires the
# Steamworks SDK redistributable at link time (steam_api.dll on
# Windows). Only compiled when `--features steam` is passed —
# default builds have zero Steam overhead.
[features]
steam = ["dep:steamworks"]

[dependencies.steamworks]
version = "0.11"
optional = true

# ── Native-only dependencies (not compiled for wasm32-unknown-unknown) ──
#
# Phase 30 session 1: all deps that use C libraries, platform-specific
# OS APIs, or are only referenced by modules excluded from WASM builds
# (play3d / play_visual / physics3d / cli / build) move here. This
# lets `cargo build --target wasm32-unknown-unknown` succeed without a
# C toolchain configured for WASM. The corresponding modules are gated
# with `#[cfg(not(target_arch = "wasm32"))]` in src/lib.rs.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Phase 5 task 5 session 1: wgpu-driven 3D rendering for `twec play3d`.
# winit handles the window + event loop; pollster blocks on the few
# async wgpu calls (adapter + device acquisition). bytemuck only
# enters when vertex / uniform layout work lands in a later session.
wgpu = "22.0"
winit = "0.30"
pollster = "0.3"
# Phase 5 task 5 session (b): vertex / uniform buffer layout via
# `#[derive(Pod, Zeroable)]`.
bytemuck = { version = "1", features = ["derive"] }
# v0.2 session 1: glTF 2.0 mesh import. Pure-Rust crate but only
# referenced by play3d / physics3d which are excluded from WASM.
gltf = { version = "1", default-features = false, features = ["import", "utils", "names"] }
# Phase 9 session 5: cross-platform gamepad input via XInput / evdev /
# IOKit. gilrs has no WASM backend; gamepad is no-op on the web target.
gilrs = "0.10"
# Phase 10 session 5b: cross-platform OS clipboard (Win32, NSPasteboard,
# X11, Wayland). Not available in the browser sandbox.
arboard = "3"
# Phase 18: rapier3d physics (referenced only by physics3d.rs which is
# excluded from WASM). Pure Rust — could compile to wasm32, but the
# 3D play loop is native-only for Phase 30.
rapier3d = { version = "0.22", default-features = false, features = ["dim3", "f32"] }
# Phase 12 session 8: zstd bundle compression. Links libzstd via `cc`
# which requires a C toolchain configured for the target; not available
# for wasm32-unknown-unknown without emscripten/wasi-sdk. WASM builds
# produce uncompressed asset copies; bundles stay native-only.
zstd = "0.13"
# Phase 17 session 3: PNG/JPEG texture loading for the 3D pipeline.
# Transitively available via macroquad on WASM, but the explicit dep
# is only needed by play3d which is native-only.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Phase 11 follow-on: Win32 bindings for GetForegroundWindow polling.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }

# ── WASM-only dependencies ──
#
# Phase 30 session 2: quad_url provides synchronous localStorage access
# via miniquad's JS-FFI layer. Used by save.rs to reroute save_to_path /
# load_from_path to localStorage on the web target. Only compiled when
# targeting wasm32-unknown-unknown.
[target.'cfg(target_arch = "wasm32")'.dependencies]
quad-url = "0.1"

[dev-dependencies]
insta = "1.41"
# Phase 11 session 8: tiny dev-only PNG encoder for the walk-cycle
# spritesheet generator (`tests/gen_walk_sheet.rs`). image is already
# pulled transitively by macroquad / gltf, so this is a re-export
# more than a new dep. PNG-only feature set.
image = { version = "0.25", default-features = false, features = ["png"] }
# Phase 9 session 11: WGSL validation in tests without needing a GPU.
# naga is wgpu's WGSL frontend; if naga accepts the shader, wgpu's
# create_shader_module will too. Pinned to match wgpu = 22.0.
naga = { version = "22", default-features = false, features = ["wgsl-in"] }
# Phase 11 session 6: criterion bench harness driving the perf gap
# from Phase 8.5. Statistical (warmup + sample-size + outlier
# detection) so the regression numbers are stable run-to-run.
# default-features = false drops `rayon` which we don't need.
criterion = { version = "0.5", default-features = false, features = ["html_reports", "cargo_bench_support"] }

[[bench]]
name = "vm"
harness = false
