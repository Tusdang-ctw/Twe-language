[package]
name = "twec"
version = "0.1.0-pre"
edition = "2021"
description = "Twe language compiler and tree-walking interpreter"
publish = false

[lints.rust]
# v0.2 Phase 8.5 (session 8a): eased from `forbid` to `deny` so
# `src/tagged_value.rs` can scope `#![allow(unsafe_code)]`. NaN
# tagging requires bit-level pointer manipulation
# (`Rc::into_raw` / `Rc::from_raw`) that Rust's safety model
# can't express in safe code. Phase 11 follow-on extends the
# exception to `src/window_focus.rs` for `GetForegroundWindow`
# / `GetWindowThreadProcessId` (auto-pause-on-window-blur).
# The exception is intentionally narrow: only those two files
# may use unsafe; every other module stays under the
# project-wide deny.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
macroquad = { version = "0.4", default-features = false, features = ["audio"] }
# Phase 5 task 5 session 1: wgpu-driven 3D rendering for `twec play3d`.
# winit handles the window + event loop; pollster blocks on the few
# async wgpu calls (adapter + device acquisition). bytemuck only
# enters when vertex / uniform layout work lands in a later session.
wgpu = "22.0"
winit = "0.30"
pollster = "0.3"
# Phase 5 task 5 session (b): vertex / uniform buffer layout via
# `#[derive(Pod, Zeroable)]`. Required as soon as the GPU sees
# anything other than a clear color.
bytemuck = { version = "1", features = ["derive"] }
# v0.2 session 1: glTF 2.0 mesh import. Pure-Rust, no native deps.
# Default features pull the `image` crate (texture decoding) which
# we don't need yet — disabled. `import` gives us `gltf::import` for
# .glb loading; `utils` exposes the `Reader` API used to extract
# POSITION / NORMAL / index accessors.
gltf = { version = "1", default-features = false, features = ["import", "utils"] }
# Phase 9 session 5: cross-platform gamepad input. Macroquad 0.4 has
# no gamepad support of its own (input.rs ships a "and gamepads soon"
# header and zero functions); gilrs is the canonical Rust gamepad
# crate, uses XInput on Windows, evdev on Linux, IOKit on macOS. No
# native build deps on any of the target platforms.
gilrs = "0.10"
# Phase 10 session 5b: cross-platform OS clipboard. Settings menus need
# Ctrl+V paste in text inputs and the eventual share / export-link UI
# will need write. arboard is the de-facto Rust clipboard crate
# (Win32, NSPasteboard, X11, Wayland) and adds no native build deps
# on the Windows + macOS + Linux trio that v1.0 targets.
arboard = "3"

# Phase 11 follow-on (deeper): true auto-pause-on-window-blur. macroquad
# 0.4 doesn't surface desktop focus events, so the play loop polls
# `GetForegroundWindow` once per frame and compares the owning PID
# to our own. windows-sys is the official low-level binding crate;
# only `Win32_UI_WindowsAndMessaging` is enabled — the smallest
# feature set that covers `GetForegroundWindow` /
# `GetWindowThreadProcessId`. Builds vanish on non-Windows targets.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
insta = "1.41"
# Phase 11 session 8: tiny dev-only PNG encoder for the walk-cycle
# spritesheet generator (`tests/gen_walk_sheet.rs`). image is already
# pulled transitively by macroquad / gltf, so this is a re-export
# more than a new dep. PNG-only feature set.
image = { version = "0.25", default-features = false, features = ["png"] }
# Phase 9 session 11: WGSL validation in tests without needing a GPU.
# naga is wgpu's WGSL frontend; if naga accepts the shader, wgpu's
# create_shader_module will too. Pinned to match wgpu = 22.0.
naga = { version = "22", default-features = false, features = ["wgsl-in"] }
# Phase 11 session 6: criterion bench harness driving the perf gap
# from Phase 8.5. Statistical (warmup + sample-size + outlier
# detection) so the regression numbers are stable run-to-run.
# default-features = false drops `rayon` which we don't need.
criterion = { version = "0.5", default-features = false, features = ["html_reports", "cargo_bench_support"] }

[[bench]]
name = "vm"
harness = false
