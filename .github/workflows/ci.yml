name: ci

# Phase 7 #1 companion: regular CI gate. Runs on every PR + push
# to main. Builds, tests, lints, and checks fmt; mirrors the
# locally-required pre-merge bar in CLAUDE.md ("zero warnings,
# clippy clean, tests pass, docs in same commit").

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (release)
        run: cargo build --release

      - name: Test
        run: cargo test --release

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      # Format check is Linux-only — line-ending differences across
      # platforms make rustfmt --check noisy on Windows checkouts.
      - name: Format check
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
