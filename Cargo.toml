[package]
name = "twec"
version = "0.1.0-pre"
edition = "2021"
description = "Twe language compiler and tree-walking interpreter"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
macroquad = { version = "0.4", default-features = false }

[dev-dependencies]
insta = "1.41"
